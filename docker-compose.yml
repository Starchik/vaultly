version: '3.8'

services:
  vaultly:
    # Используем готовый собранный образ (нужно собрать и загрузить отдельно)
    # ИЛИ собираем на месте из репо (если есть доступ к файлам)
    image: vaultly:latest
    container_name: vaultly
    restart: unless-stopped
    
    ports:
      - "9990:9990"
    networks:
      - vaultly-network
    
    environment:
      - PORT=9990
      - NODE_ENV=production
      - DATA_DIR=/data
    
    # ТОЛЬКО volume для данных - БД, JWT-секрет, загруженные файлы
    volumes:
      - vaultly_data:/data
    
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9990"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  vaultly_data:
    driver: local

networks:
  vaultly-network:
    driver: bridge
