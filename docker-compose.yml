version: '3.8'

services:
  vaultly:
    # Используем готовый образ вместо node:20-alpine
    # чтобы не собирать его каждый раз
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vaultly
    restart: unless-stopped
    
    # Портали и сеть
    ports:
      - "9990:9990"
    networks:
      - vaultly-network
    
    # Переменные окружения
    environment:
      - PORT=9990
      - NODE_ENV=production
      - DATA_DIR=/app/server/storage
    
    # Монтирование волюма ДЛЯ ДАННЫХ (не код)
    volumes:
      - vaultly_data:/app/server/storage
    
    # Healthcheck для мониторинга
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9990"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  vaultly_data:
    driver: local

networks:
  vaultly-network:
    driver: bridge
