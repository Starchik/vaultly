version: '3.8'

services:
  vaultly:
    # Собираем образ из Dockerfile в репозитории
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
    
    image: vaultly:synology
    container_name: vaultly
    restart: unless-stopped
    
    ports:
      - "9990:9990"
    networks:
      - vaultly-network
    
    environment:
      - PORT=9990
      - NODE_ENV=production
      - DATA_DIR=/app/server/storage
    
    # ТОЛЬКО volume для постоянных данных
    volumes:
      - vaultly_data:/app/server/storage
    
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9990"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  vaultly_data:
    driver: local

networks:
  vaultly-network:
    driver: bridge
