version: '3.8'

services:
  vaultly:
    # Используем готовый образ вместо build
    # Образ создается из Dockerfile и пушится на Docker Hub
    image: node:20-alpine
    container_name: vaultly
    restart: unless-stopped
    
    ports:
      - "9990:9990"
    networks:
      - vaultly-network
    
    environment:
      - PORT=9990
      - NODE_ENV=production
    
    volumes:
      - vaultly_data:/app/server/storage
    
    working_dir: /app/server
    
    # Установка зависимостей и запуск сервера при старте контейнера
    command: >
      sh -c "
      mkdir -p /app/server /app/public &&
      npm ci --omit=dev &&
      node server.js
      "
    
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9990"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  vaultly_data:
    driver: local

networks:
  vaultly-network:
    driver: bridge
